# Builds MingDesk for Apple silicon and Intel (one universal app, macOS 10.14+), wraps it in a .dmg and
# publishes it on a GitHub Release. Alongside it, the `windows` job builds the Windows installer (NSIS, x64,
# unsigned for now: SmartScreen warns, PLAN.md §5), and `publish-windows` adds it to that same release once the
# macOS job has created it. The macOS job is the only one that creates the release, so the two can't race.
#
# Release: bump the version (package.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json), give it a section
# in CHANGELOG.md, commit, tag vX.Y.Z and push the tag. This workflow does the rest; don't publish by hand.
# A CHANGELOG heading with "preview" in it makes a pre-release.
# Manual run (Actions tab → Release → Run workflow): builds the .dmg as a download on the run, publishes nothing.
#
# Signing: the "MingDesk Dev" certificate from the MINGDESK_DEV_P12 / MINGDESK_DEV_P12_PASSWORD secrets
# (scripts/set-release-secrets.sh), so every release has the same signature and the Accessibility permission
# carries over between versions. Without the secrets a manual run builds unsigned; a tag run refuses.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAGGED: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust for Apple silicon and Intel
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install
        run: npm ci

      - name: Versions agree (and match the tag)
        run: |
          v=$(node -p "require('./package.json').version")
          c=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          t=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$v" = "$c" ] && [ "$v" = "$t" ] || { echo "package.json $v, Cargo.toml $c, tauri.conf.json $t"; exit 1; }
          if [ "$TAGGED" = true ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but the version is $v"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          (cd src-tauri && cargo test)
          npm run build

      - name: Signing certificate
        env:
          P12: ${{ secrets.MINGDESK_DEV_P12 }}
          P12_PASSWORD: ${{ secrets.MINGDESK_DEV_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            if [ "$TAGGED" = true ]; then echo "No MINGDESK_DEV_P12 secret: releases must be signed."; exit 1; fi
            echo "No certificate secret: this manual build is unsigned."; exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=MingDesk Dev" >> "$GITHUB_ENV"

      - name: Build the universal app
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Check it
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/MingDesk.app
          fail() { echo "::error::$1"; exit 1; }
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/mingdesk"); echo "architectures: $ARCHS"
          case "$ARCHS" in *x86_64*arm64*|*arm64*x86_64*) ;; *) fail "not universal: $ARCHS" ;; esac
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist"); echo "minimum macOS: $MIN"
          [ "$MIN" = 10.14 ] || fail "minimum macOS is $MIN, not 10.14"
          SIG=$(codesign -dvv "$APP" 2>&1 || true); echo "$SIG"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP" || fail "codesign --verify failed"
            echo "$SIG" | grep -q '^Authority=MingDesk Dev$' || fail "not signed by MingDesk Dev"
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Make the .dmg and notes
        run: |
          sh scripts/make-dmg.sh "$APP" "release/MingDesk-$VERSION-universal.dmg"
          sh scripts/release-notes.sh "$VERSION" > release/NOTES.md

      - name: Publish the release
        if: env.TAGGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          grep -E "^## $VERSION( |$)" CHANGELOG.md | grep -qi preview && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" release/*.dmg --title "MingDesk $GITHUB_REF_NAME" \
            --notes-file release/NOTES.md $PRE

      - name: Keep the .dmg (manual runs)
        if: env.TAGGED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mingdesk-dmg
          path: |
            release/*.dmg
            release/NOTES.md

  # The Windows installer, built while the Mac builds. Kept as a download on every run; a tag run hands it to
  # publish-windows.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAGGED: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install
        run: npm ci

      - name: Versions agree (and match the tag)
        run: |
          v=$(node -p "require('./package.json').version")
          c=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          t=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$v" = "$c" ] && [ "$v" = "$t" ] || { echo "package.json $v, Cargo.toml $c, tauri.conf.json $t"; exit 1; }
          if [ "$TAGGED" = true ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but the version is $v"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          (cd src-tauri && cargo test)
          npm run build

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Check it
        run: |
          fail() { echo "::error::$1"; exit 1; }
          shopt -s nullglob
          found=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          [ ${#found[@]} -eq 1 ] || fail "expected one NSIS installer, found ${#found[@]}"
          size=$(stat -c %s "${found[0]}"); echo "${found[0]}: $size bytes"
          [ "$size" -gt 1000000 ] || fail "the installer is suspiciously small"
          mkdir -p release
          cp "${found[0]}" "release/MingDesk-$VERSION-x64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: mingdesk-windows
          path: release/*.exe

  # Adds the Windows installer, and how to install it, to the release the macOS job created. Runs only on a tag,
  # and only after both builds succeeded.
  publish-windows:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mingdesk-windows
          path: release

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/*.exe
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          cat >> notes.md <<'NOTES'

          ## Install on Windows

          1. Download **MingDesk-*-x64-setup.exe** below (Windows 10 or 11, 64-bit Intel or AMD).
          2. Run it. Windows SmartScreen will say it protected your PC: MingDesk isn't code-signed yet. Click
             **More info**, then **Run anyway**.
          3. MingDesk starts in the tray (by the clock). Left-click its icon to open the board; right-click for Quit.
             Windows asks for no permission: MingDesk can see and focus your windows straight away, and nothing
             leaves your PC.
          NOTES
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
